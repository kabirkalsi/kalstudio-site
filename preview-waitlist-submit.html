<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kalstudio waitlist submit preview</title>
    <style>
      @font-face {
        font-family: "Messina Sans";
        src: url("assets/fonts/MessinaSans-Light.woff2") format("woff2"),
          url("assets/fonts/MessinaSans-Light.woff") format("woff");
        font-weight: 300;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Messina Sans";
        src: url("assets/fonts/MessinaSans-Regular.woff2") format("woff2"),
          url("assets/fonts/MessinaSans-Regular.woff") format("woff");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --bg: #f7f0e7;
        --ink: #1b140f;
        --muted: #6b5f52;
        --line: #e5d6c5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Messina Sans", sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.6;
        font-size: 16px;
        padding: 48px 24px;
      }

      h1,
      p,
      label,
      button {
        font: inherit;
        letter-spacing: normal;
        text-transform: none;
      }

      .panel {
        max-width: 640px;
        margin: 0 auto;
        border: 1px solid var(--line);
        border-radius: 20px;
        background: #fffaf4;
        padding: 28px;
        display: grid;
        gap: 14px;
      }

      .panel p {
        margin: 0;
        text-align: center;
        color: var(--muted);
        font-weight: 300;
      }

      .form-stack {
        display: grid;
        gap: 12px;
      }

      label {
        font-size: 0.85rem;
        color: var(--muted);
      }

      input[type="text"],
      input[type="email"] {
        width: 100%;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: #fff;
        font-family: "Messina Sans", sans-serif;
        font-size: 1rem;
      }

      .checkbox-group {
        display: grid;
        gap: 10px;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: #fff;
      }

      .checkbox-row {
        display: flex;
        align-items: center;
        gap: 10px;
        color: var(--muted);
        font-weight: 300;
      }

      .checkbox-row input {
        width: 16px;
        height: 16px;
        margin: 0;
      }

      .cta {
        background: none;
        border: none;
        padding: 0;
        color: var(--muted);
        text-decoration: underline;
        text-decoration-color: rgba(27, 20, 15, 0.35);
        text-underline-offset: 0.25em;
        cursor: pointer;
        justify-self: center;
      }

      .form-status {
        margin: 6px 0 0;
        min-height: 20px;
        font-size: 0.9rem;
        color: var(--muted);
        font-weight: 300;
        text-align: center;
      }

      .meta {
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
        margin: 0 auto 18px;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 class="meta">Preview: persistent confirmation + delayed clear (2s)</h1>
      <section class="panel">
        <p>Join the list for early access to limited releases and new concepts.</p>
        <form class="form-stack">
          <label for="name">Name</label>
          <input id="name" type="text" value="Alex" />

          <label for="email">Email</label>
          <input id="email" type="email" value="alex@example.com" />

          <label>Products</label>
          <div class="checkbox-group">
            <label class="checkbox-row" for="all">
              <input id="all" type="checkbox" />
              All concepts
            </label>
            <label class="checkbox-row" for="c1">
              <input id="c1" type="checkbox" checked />
              Concept 01
            </label>
            <label class="checkbox-row" for="c2">
              <input id="c2" type="checkbox" checked />
              Concept 02
            </label>
          </div>

          <button class="cta" type="button">Join the list</button>
          <p class="form-status">Thank you! You're on the list.</p>
        </form>
      </section>
    </main>
  </body>
</html>
