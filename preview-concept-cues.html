<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kalstudio concept cue preview</title>
    <style>
      @font-face {
        font-family: "Messina Sans";
        src: url("assets/fonts/MessinaSans-Light.woff2") format("woff2"),
          url("assets/fonts/MessinaSans-Light.woff") format("woff");
        font-weight: 300;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Messina Sans";
        src: url("assets/fonts/MessinaSans-Regular.woff2") format("woff2"),
          url("assets/fonts/MessinaSans-Regular.woff") format("woff");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --bg: #f7f0e7;
        --ink: #1b140f;
        --muted: #6b5f52;
        --line: #e5d6c5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Messina Sans", sans-serif;
        color: var(--ink);
        background: var(--bg);
        line-height: 1.6;
        font-size: 16px;
        padding: 48px 24px;
      }

      h1,
      h2,
      p,
      button,
      span {
        font: inherit;
        letter-spacing: normal;
        text-transform: none;
      }

      .wrap {
        max-width: 920px;
        margin: 0 auto;
        display: grid;
        gap: 24px;
      }

      .card {
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 20px;
        background: rgba(255, 255, 255, 0.5);
        display: grid;
        gap: 12px;
      }

      .concept-row {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      .concept-toggle {
        background: none;
        border: none;
        padding: 0;
        color: var(--ink);
        text-decoration: underline;
        text-decoration-color: rgba(27, 20, 15, 0.35);
        text-underline-offset: 0.2em;
        cursor: pointer;
        font-weight: 300;
      }

      .cue {
        color: var(--muted);
        font-size: 0.9rem;
        display: inline-flex;
        align-items: center;
        gap: 6px;
      }

      .cue-dot {
        width: 6px;
        height: 6px;
        border-radius: 999px;
        background: rgba(27, 20, 15, 0.35);
      }

      .cue-chevron {
        width: 14px;
        height: 14px;
        border-right: 1.5px solid rgba(27, 20, 15, 0.5);
        border-bottom: 1.5px solid rgba(27, 20, 15, 0.5);
        transform: rotate(45deg);
      }

      .cue-plus {
        width: 14px;
        height: 14px;
        position: relative;
      }

      .cue-plus::before,
      .cue-plus::after {
        content: "";
        position: absolute;
        background: rgba(27, 20, 15, 0.5);
      }

      .cue-plus::before {
        width: 100%;
        height: 1.5px;
        top: 6px;
        left: 0;
      }

      .cue-plus::after {
        width: 1.5px;
        height: 100%;
        left: 6px;
        top: 0;
      }

      .microcopy {
        color: var(--muted);
        font-size: 0.9rem;
      }

      @media (max-width: 640px) {
        .concept-row {
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section class="card">
        <h1>Concept cue options</h1>
        <p>Subtle ways to signal that concept rows are expandable.</p>
      </section>

      <section class="card">
        <h2>Option A — “View details” microcopy</h2>
        <div class="concept-row">
          <button class="concept-toggle" type="button">Concept 01</button>
          <span class="microcopy">View details</span>
        </div>
      </section>

      <section class="card">
        <h2>Option B — Chevron indicator</h2>
        <div class="concept-row">
          <button class="concept-toggle" type="button">Concept 01</button>
          <span class="cue" aria-hidden="true"><span class="cue-chevron"></span></span>
        </div>
      </section>

      <section class="card">
        <h2>Option C — “View details” + dot</h2>
        <div class="concept-row">
          <button class="concept-toggle" type="button">Concept 01</button>
          <span class="cue"><span class="cue-dot"></span>View details</span>
        </div>
      </section>

      <section class="card">
        <h2>Option D — Plus indicator</h2>
        <div class="concept-row">
          <button class="concept-toggle" type="button">Concept 01</button>
          <span class="cue" aria-hidden="true"><span class="cue-plus"></span></span>
        </div>
      </section>
    </main>
  </body>
</html>
