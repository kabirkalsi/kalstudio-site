<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kalstudio focus state preview</title>
    <style>
      @font-face {
        font-family: "Messina Sans";
        src: url("assets/fonts/MessinaSans-Light.woff2") format("woff2"),
          url("assets/fonts/MessinaSans-Light.woff") format("woff");
        font-weight: 300;
        font-style: normal;
        font-display: swap;
      }

      @font-face {
        font-family: "Messina Sans";
        src: url("assets/fonts/MessinaSans-Regular.woff2") format("woff2"),
          url("assets/fonts/MessinaSans-Regular.woff") format("woff");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }

      :root {
        --bg: #f7f0e7;
        --ink: #1b140f;
        --muted: #6b5f52;
        --line: #e5d6c5;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Messina Sans", sans-serif;
        background: var(--bg);
        color: var(--ink);
        line-height: 1.6;
        font-size: 16px;
        padding: 48px 24px;
      }

      h1,
      h2,
      p,
      a,
      button {
        font: inherit;
        letter-spacing: normal;
        text-transform: none;
      }

      .wrap {
        max-width: 900px;
        margin: 0 auto;
        display: grid;
        gap: 24px;
      }

      .preview-card {
        border: 1px solid var(--line);
        border-radius: 18px;
        padding: 20px;
        display: grid;
        gap: 12px;
        background: rgba(255, 255, 255, 0.5);
      }

      .link {
        color: var(--muted);
        text-decoration: underline;
        text-decoration-color: rgba(27, 20, 15, 0.35);
        text-underline-offset: 0.25em;
      }

      .button-link {
        background: none;
        border: none;
        padding: 0;
        cursor: pointer;
        color: var(--muted);
        text-decoration: underline;
        text-decoration-color: rgba(27, 20, 15, 0.35);
        text-underline-offset: 0.25em;
      }

      /* Style A: soft outline + darker underline */
      .focus-a:focus-visible {
        outline: 1px solid rgba(27, 20, 15, 0.35);
        outline-offset: 3px;
        color: var(--ink);
        text-decoration-color: rgba(27, 20, 15, 0.8);
      }

      /* Style B: subtle underline highlight */
      .focus-b:focus-visible {
        outline: none;
        color: var(--ink);
        text-decoration-color: rgba(27, 20, 15, 0.9);
        text-decoration-thickness: 2px;
      }

      /* Style C: soft halo pill */
      .focus-c:focus-visible {
        outline: 2px solid rgba(27, 20, 15, 0.18);
        outline-offset: 6px;
        border-radius: 999px;
        color: var(--ink);
        text-decoration-color: rgba(27, 20, 15, 0.7);
      }

      .row {
        display: flex;
        flex-wrap: wrap;
        gap: 16px;
      }
    </style>
  </head>
  <body>
    <main class="wrap">
      <section>
        <h1>Focus state previews</h1>
        <p>Press Tab to cycle through items in each card.</p>
      </section>

      <section class="preview-card">
        <h2>Style A — Soft outline</h2>
        <div class="row">
          <a class="link focus-a" href="#">Shop</a>
          <a class="link focus-a" href="#">Stay updated</a>
          <button class="button-link focus-a" type="button">Concept 01</button>
          <button class="button-link focus-a" type="button">Prev</button>
          <button class="button-link focus-a" type="button">Next</button>
        </div>
      </section>

      <section class="preview-card">
        <h2>Style B — Bold underline</h2>
        <div class="row">
          <a class="link focus-b" href="#">Shop</a>
          <a class="link focus-b" href="#">Stay updated</a>
          <button class="button-link focus-b" type="button">Concept 01</button>
          <button class="button-link focus-b" type="button">Prev</button>
          <button class="button-link focus-b" type="button">Next</button>
        </div>
      </section>

      <section class="preview-card">
        <h2>Style C — Soft halo</h2>
        <div class="row">
          <a class="link focus-c" href="#">Shop</a>
          <a class="link focus-c" href="#">Stay updated</a>
          <button class="button-link focus-c" type="button">Concept 01</button>
          <button class="button-link focus-c" type="button">Prev</button>
          <button class="button-link focus-c" type="button">Next</button>
        </div>
      </section>
    </main>
  </body>
</html>
